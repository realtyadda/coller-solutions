<!doctype html><html><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coller HRMS v3</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#17233c}.w{max-width:600px;margin:auto;padding:18px}.c{background:#fff;padding:18px;border-radius:16px;margin:14px 0;box-shadow:0 3px 16px #0001}input,select,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border-radius:9px;border:1px solid #ccd4df;font-size:15px}button{background:#123a6d;color:#fff;border:0}.s{background:#e8eef6;color:#123a6d}.muted{font-size:13px;color:#687386}.hide{display:none}img{max-width:100%;border-radius:12px;margin-top:8px}</style></head><body><div class="w"><h2>Coller Solutions LLP</h2><div class="muted">Attendance • Expenses • HRMS</div><div class="c" id="login"><h3>Employee Login</h3><input id="eid" value="COL001" placeholder="Employee ID"><button onclick="go()">Continue</button></div><div id="app" class="hide"><div class="c"><h3>Attendance</h3><div class="muted">Take a fresh selfie, then GPS is captured when you submit attendance.</div><input id="selfie" type="file" accept="image/*" capture="user" onchange="preview(this)"><img id="pic" class="hide"><button onclick="att('checkin')">Check In</button><button class="s" onclick="att('checkout')">Check Out</button><div id="ast" class="muted">Ready.</div></div><div class="c"><h3>Monthly Expense Claim</h3><input id="edate" type="date"><select id="scope"><option>Local</option><option>Outstation</option></select><select id="cat" onchange="mode()"><option>Bike / Scooter</option><option>Car</option><option>Public Transport</option><option>Food</option><option>Stay / Hotel</option><option>Toll / Parking</option><option>Other</option></select><input id="from" placeholder="From"><input id="to" placeholder="To"><input id="purpose" placeholder="Purpose / Client / Site"><input id="km" type="number" step=".1" placeholder="KM (Bike/Car)"><input id="amount" type="number" step=".01" placeholder="Actual amount (other categories)"><input id="receipt" type="file" accept="image/*,application/pdf" capture="environment"><button onclick="addExpense()">Add Entry</button><div id="est" class="muted">Multiple entries on the same date are allowed. Entries stay as draft until monthly submission.</div></div><div class="c"><h3>My HRMS</h3><button class="s">Attendance & Working Hours</button><button class="s">Monthly Expenses</button><button class="s">Salary & Payslips</button></div></div></div><script>let emp='',photo='';function go(){emp=eid.value.trim().toUpperCase();if(!emp)return;login.classList.add('hide');app.classList.remove('hide')}function preview(i){let f=i.files[0];if(!f)return;let r=new FileReader;r.onload=e=>{photo=e.target.result;pic.src=photo;pic.classList.remove('hide');ast.textContent='Selfie captured.'};r.readAsDataURL(f)}function gps(){return new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(p=>res(p.coords),()=>rej(new Error('Location permission is required.')),{enableHighAccuracy:true,timeout:15000,maximumAge:0}))}async function att(a){if(!photo){ast.textContent='Take selfie first.';return}try{ast.textContent='Getting GPS...';let g=await gps();ast.textContent='Submitting...';google.script.run.withSuccessHandler(r=>{ast.textContent=(a==='checkin'?'Check-in':'Check-out')+' successful.';photo='';selfie.value='';pic.classList.add('hide')}).withFailureHandler(e=>ast.textContent='Error: '+e.message).processAttendance(a,emp,g.latitude,g.longitude,photo)}catch(e){ast.textContent=e.message}}function mode(){}function addExpense(){est.textContent='Expense entry UI is ready; backend save/approval will be connected in the next v3 backend update.'}</script></body></html>
