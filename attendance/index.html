<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coller Attendance</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#16213e}.wrap{max-width:560px;margin:auto;padding:20px}.card{background:white;padding:20px;border-radius:16px;margin:14px 0;box-shadow:0 3px 16px #0001}button{width:100%;padding:14px;margin:7px 0;border:0;border-radius:10px;background:#123a6d;color:white;font-size:16px}.secondary{background:#e9eef5;color:#123a6d}input,select{box-sizing:border-box;width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ccd3dd;border-radius:9px}.muted{color:#687386;font-size:13px}</style></head><body><div class="wrap"><h2>Coller Solutions</h2><div class="muted">Employee Attendance & Conveyance</div><div class="card"><h3>Attendance</h3><button onclick="loc('IN')">📷 Check In with Selfie & GPS</button><button onclick="loc('OUT')">📷 Check Out with Selfie & GPS</button><p id="gps" class="muted">GPS permission will be requested only when required.</p></div><div class="card"><h3>Conveyance</h3><input id="from" placeholder="From"><input id="to" placeholder="To"><input id="purpose" placeholder="Purpose / Client / Site"><select id="vehicle"><option>Bike / Scooter</option><option>Car</option></select><input id="km" type="number" step=".1" placeholder="Kilometres"><div class="muted">Amount = approved KM × admin-set ₹/KM rate.</div><button class="secondary">Submit Conveyance Claim</button></div><div class="card"><h3>My Reports</h3><button class="secondary">Attendance & Working Hours</button><button class="secondary">Monthly Conveyance</button></div></div><script>function loc(t){navigator.geolocation.getCurrentPosition(p=>document.getElementById('gps').textContent=t+' GPS captured: '+p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5),e=>document.getElementById('gps').textContent='Location permission is required for '+t);}</script></body></html>
