<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coller HRMS Admin</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#16213e}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;padding:20px;border-radius:16px;margin:14px 0;box-shadow:0 3px 16px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}label{display:flex;justify-content:space-between;gap:12px;padding:12px;border:1px solid #e1e6ee;border-radius:10px}input{padding:10px;border:1px solid #ccd3dd;border-radius:8px;width:90px}button{padding:12px 16px;border:0;border-radius:10px;background:#123a6d;color:#fff}.muted{color:#687386;font-size:13px}</style></head><body><div class="wrap"><h2>Coller Solutions — HRMS Admin</h2><div class="card"><h3>Module Controls</h3><p class="muted">Admin can enable/disable HRMS functions independently.</p><div class="grid"><label>Attendance <input type="checkbox" checked></label><label>Conveyance <input type="checkbox" checked></label><label>Payroll / Payslip <input type="checkbox" checked></label><label>Field GPS <input type="checkbox"></label></div></div><div class="card"><h3>Conveyance Rates</h3><div class="grid"><label>Bike / Scooter ₹/km <input id="bike" type="number" value="4"></label><label>Car ₹/km <input id="car" type="number" value="10"></label></div><p class="muted">Rates are admin controlled. Claims require approval before final amount is posted.</p><button>Save Settings</button></div><div class="card"><h3>Employee Management</h3><div class="grid"><button>Employee Master</button><button>Attendance Review</button><button>Regularization Requests</button><button>Conveyance Approval</button><button>Payroll & Payslips</button><button>Monthly Reports</button></div></div></div></body></html>
