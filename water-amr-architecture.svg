<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" role="img" aria-labelledby="title desc">
<title id="title">Smart water metering: AMR and billing architecture</title>
<desc id="desc">Water meters in three units send readings to an AMR gateway or data collector. The gateway transfers data to meter-reading software. The software provides consumption reports and data for billing.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1767dd"/></marker></defs>
