<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#13263e">
<text x="320" y="48" font-size="30" font-weight="700">AMR &amp; BILLING SYSTEM</text>
<text x="320" y="84" font-size="25" fill="#526278">Automatic meter reading</text>
<g fill="white" stroke="#a9c7ed" stroke-width="2"><rect x="22" y="114" width="186" height="88" rx="8"/><rect x="227" y="114" width="186" height="88" rx="8"/><rect x="432" y="114" width="186" height="88" rx="8"/></g>
<g font-size="26" font-weight="700"><text x="115" y="150">Water meter</text><text x="320" y="150">Water meter</text><text x="525" y="150">Water meter</text></g>
<g font-size="24" fill="#526278"><text x="115" y="184">Unit A</text><text x="320" y="184">Unit B</text><text x="525" y="184">Unit C</text></g>
<g fill="none" stroke="#1767dd" stroke-width="3"><path d="M115 202V229H525V202M320 202V264" marker-end="url(#arrow)"/></g>
<rect x="105" y="278" width="430" height="82" rx="8" fill="#1767dd"/>
<text x="320" y="312" font-size="28" font-weight="700" fill="white">AMR gateway</text><text x="320" y="342" font-size="24" fill="white">Data collector</text>
<path d="M320 360V412" stroke="#1767dd" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="105" y="427" width="430" height="80" rx="8" fill="white" stroke="#a9c7ed" stroke-width="2"/>
<text x="320" y="461" font-size="28" font-weight="700">Meter-reading software</text><text x="320" y="491" font-size="24" fill="#526278">Consumption data</text>
<g fill="none" stroke="#1767dd" stroke-width="3"><path d="M320 507V535H160V553" marker-end="url(#arrow)"/><path d="M320 535H480V553" marker-end="url(#arrow)"/></g>
<g fill="#e0edf9" stroke="#a9c7ed" stroke-width="2"><rect x="35" y="568" width="250" height="66" rx="8"/><rect x="355" y="568" width="250" height="66" rx="8"/></g>
<g font-size="27" font-weight="700"><text x="160" y="609">Usage reports</text><text x="480" y="609">Billing system</text></g>
</g></svg>